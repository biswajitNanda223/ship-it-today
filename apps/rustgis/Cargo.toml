[package]
name = "ship-it-rustgis"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
geo = "0.31"
rstar = "0.12"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
